[workspace]
name = "open-science"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11"
pyyaml = ">=6"
jsonschema = ">=4.20"
pytest = ">=8"
git = "*"
nodejs = ">=20"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.7,<10"

[pypi-dependencies]
opsci = { path = "tools", editable = true }

[tasks]
test = "bash tests/run_all"
